<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ------------------------------------------------------------------ */
/*  Base: classificação em 17/09/2026, após a 27ª rodada               */
/*  Os jogos lançados em resultados.js são somados sobre esta base.    */
/*  [código, nome, J, V, E, D, GP, GC]                                 */
/* ------------------------------------------------------------------ */
const LIGA = [
  ["FLA", "Flamengo", 27, 17, 6, 4, 53, 22],
  ["PAL", "Palmeiras", 27, 16, 8, 3, 47, 21],
  ["CAP", "Athletico-PR", 27, 13, 7, 7, 41, 31],
  ["BAH", "Bahia", 27, 12, 10, 5, 42, 33],
  ["FLU", "Fluminense", 27, 12, 9, 6, 41, 35],
  ["CRU", "Cruzeiro", 27, 12, 6, 9, 39, 39],
  ["CAM", "Atlético-MG", 26, 11, 6, 9, 35, 31],
  ["CTB", "Coritiba", 27, 10, 8, 9, 37, 38],
  ["RBB", "Bragantino", 26, 10, 6, 10, 32, 29],
  ["SAN", "Santos", 26, 9, 8, 9, 39, 39],
  ["BOT", "Botafogo", 27, 9, 8, 10, 41, 43],
  ["SAO", "São Paulo", 26, 9, 6, 11, 31, 30],
  ["VIT", "Vitória", 27, 9, 6, 12, 27, 39],
  ["COR", "Corinthians", 27, 8, 8, 11, 28, 29],
  ["MIR", "Mirassol", 27, 7, 8, 12, 31, 42],
  ["GRE", "Grêmio", 27, 7, 7, 13, 30, 38],
  ["VAS", "Vasco", 26, 7, 7, 12, 29, 41],
  ["INT", "Internacional", 27, 6, 10, 11, 30, 35],
  ["REM", "Remo", 27, 5, 8, 14, 31, 45],
  ["CHA", "Chapecoense", 26, 3, 8, 15, 28, 52],
];
const NOMES = {}; LIGA.forEach((t) => (NOMES[t[0]] = t[1]));
const FOCO = ["VIT", "COR", "MIR", "VAS", "GRE", "INT"];
const CAEM = 2;        // quantos dos seis descem
const FORA = ["CHA", "REM"];  // já rebaixados, não entram na disputa

/* Jogos dos quatro daqui até o fim: [rodada, mandante, visitante] */
const JOGOS = [
  [21, "CHA", "VAS"],
  [28, "COR", "FLU"], [28, "GRE", "PAL"], [28, "MIR", "BOT"], [28, "SAO", "INT"], [28, "VAS", "CTB"], [28, "VIT", "CRU"],
  [29, "BOT", "VAS"], [29, "INT", "COR"], [29, "RBB", "MIR"], [29, "REM", "GRE"], [29, "VIT", "CHA"],
  [30, "BAH", "MIR"], [30, "GRE", "INT"], [30, "PAL", "COR"], [30, "SAO", "VIT"], [30, "VAS", "REM"],
  [31, "COR", "VIT"], [31, "GRE", "CRU"], [31, "MIR", "INT"], [31, "SAO", "VAS"],
  [32, "CTB", "GRE"], [32, "INT", "BOT"], [32, "MIR", "SAO"], [32, "VAS", "COR"], [32, "VIT", "CAP"],
  [33, "COR", "MIR"], [33, "CTB", "VIT"], [33, "FLU", "INT"], [33, "GRE", "CAP"], [33, "VAS", "FLA"],
  [34, "CAP", "VAS"], [34, "CHA", "MIR"], [34, "FLA", "GRE"], [34, "INT", "CTB"], [34, "SAO", "COR"], [34, "VIT", "FLU"],
  [35, "COR", "BOT"], [35, "GRE", "BAH"], [35, "MIR", "CAM"], [35, "VAS", "INT"], [35, "VIT", "RBB"],
  [36, "CAM", "COR"], [36, "FLU", "MIR"], [36, "INT", "VIT"], [36, "RBB", "VAS"], [36, "SAN", "GRE"],
  [37, "CAM", "VAS"], [37, "COR", "GRE"], [37, "INT", "RBB"], [37, "MIR", "CAP"], [37, "VIT", "SAN"],
  [38, "CRU", "INT"], [38, "GRE", "MIR"], [38, "REM", "COR"], [38, "VAS", "VIT"],
].map(([r, h, a]) => ({ id: `${r}-${h}-${a}`, r, h, a, duelo: FOCO.includes(h) && FOCO.includes(a) }));

const RODADAS = [...new Set(JOGOS.map((j) => j.r))].sort((a, b) => a - b);
const grade = {};
RODADAS.forEach((r) => {
  grade[r] = {};
  FOCO.forEach((t) => {
    const j = JOGOS.find((x) => x.r === r && (x.h === t || x.a === t));
    grade[r][t] = j ? { j, casa: j.h === t, adv: j.h === t ? j.a : j.h } : null;
  });
});

/* ------------------------------------------------------------------ */
/*  Leitura do resultados.js / planilha                                */
/* ------------------------------------------------------------------ */
function lerResultados(texto) {
  const jogos = {}, erros = [];
  (texto || "").split(/\r?\n/).forEach((linha, i) => {
    const l = linha.trim();
    if (!l || l.startsWith("#")) return;
    const p = l.split(/[,;\t]/).map((x) => x.trim());
    if (p.length < 5) { erros.push(`linha ${i + 1}: faltam campos — "${l}"`); return; }
    const [r, h, a, gh, ga] = p;
    if (!NOMES[h.toUpperCase()] || !NOMES[a.toUpperCase()]) { erros.push(`linha ${i + 1}: sigla desconhecida — "${l}"`); return; }
    if (!/^\d+$/.test(gh) || !/^\d+$/.test(ga)) { erros.push(`linha ${i + 1}: placar inválido — "${l}"`); return; }
    const id = `${parseInt(r, 10)}-${h.toUpperCase()}-${a.toUpperCase()}`;
    if (jogos[id]) { erros.push(`linha ${i + 1}: jogo repetido — "${l}"`); return; }
    jogos[id] = { r: parseInt(r, 10), h: h.toUpperCase(), a: a.toUpperCase(), gh: +gh, ga: +ga };
  });
  return { jogos, erros };
}

function construir(oficiais) {
  const T = {};
  LIGA.forEach((t) => (T[t[0]] = { code: t[0], nome: t[1], j: t[2], v: t[3], e: t[4], d: t[5], gp: t[6], gc: t[7] }));
  const avisos = [];
  Object.values(oficiais).forEach((g) => {
    const H = T[g.h], A = T[g.a];
    H.j++; A.j++; H.gp += g.gh; H.gc += g.ga; A.gp += g.ga; A.gc += g.gh;
    if (g.gh > g.ga) { H.v++; A.d++; } else if (g.gh < g.ga) { A.v++; H.d++; } else { H.e++; A.e++; }
  });
  Object.values(T).forEach((t) => {
    t.pts = t.v * 3 + t.e; t.sg = t.gp - t.gc;
    if (t.j > 38) avisos.push(`${t.nome} está com ${t.j} jogos — algum resultado foi lançado duas vezes.`);
  });
  const LG = Object.values(T).reduce((s, t) => s + t.gp, 0) / Object.values(T).reduce((s, t) => s + t.j, 0);
  const K = 0.8, ATT = {}, DEF = {};
  Object.values(T).forEach((t) => {
    ATT[t.code] = 1 + K * ((t.gp / t.j) / LG - 1);
    DEF[t.code] = 1 + K * ((t.gc / t.j) / LG - 1);
  });
  return { T, ATT, DEF, HM: 2 * LG * 0.555, AM: 2 * LG * 0.445, avisos };
}

/* ------------------------------------------------------------------ */
/*  Escudos — arquivos em escudos/XXX.png, com desenho de reserva      */
/* ------------------------------------------------------------------ */
const PASTA = "escudos", EXT = "png";
const PADRAO = {
  FLA: { t: "h", c: ["#c8102e", "#16181d"] },
  PAL: { t: "s", c: ["#046a38"] },
  CAP: { t: "v", c: ["#c8102e", "#16181d"], n: 4 },
  BAH: { t: "b", c: ["#1a4fa0", "#e2231a", "#ffffff"] },
  FLU: { t: "v3", c: ["#9f2241", "#0f7a3d", "#ffffff"] },
  CRU: { t: "s", c: ["#1b3a8c"] },
  CAM: { t: "v", c: ["#16181d", "#ffffff"], n: 6 },
  CTB: { t: "h", c: ["#0b6b3a", "#ffffff"] },
  RBB: { t: "d", c: ["#ffffff", "#d6001c"] },
  SAN: { t: "s", c: ["#ffffff"] },
  BOT: { t: "v", c: ["#16181d", "#ffffff"], n: 8 },
  SAO: { t: "b", c: ["#ffffff", "#c8102e", "#16181d"] },
  VIT: { t: "v", c: ["#c8102e", "#16181d"], n: 8 },
  COR: { t: "b", c: ["#ffffff", "#16181d", "#ffffff"] },
  MIR: { t: "h", c: ["#f2c200", "#0e7a3c"] },
  GRE: { t: "v3", c: ["#0d80bf", "#16181d", "#ffffff"] },
  VAS: { t: "d", c: ["#ffffff", "#16181d"] },
  INT: { t: "s", c: ["#c4122e"] },
  REM: { t: "v", c: ["#0b2d6b", "#ffffff"], n: 6 },
  CHA: { t: "v3", c: ["#0e7a3c", "#ffffff", "#0e7a3c"] },
};
const ESCUDO_D = "M2 1.5H22V15.5C22 21 17.2 25 12 26.5C6.8 25 2 21 2 15.5Z";

function Desenho({ code, size }) {
  const p = PADRAO[code] || { t: "s", c: ["#9aa0a6"] };
  const id = `cl-${code}`;
  const f = [];
  if (p.t === "s") f.push(<rect key="0" x="0" y="0" width="24" height="28" fill={p.c[0]} />);
  if (p.t === "h") for (let i = 0; i < 6; i++) f.push(<rect key={i} x="0" y={i * 4.7} width="24" height="4.7" fill={p.c[i % 2]} />);
  if (p.t === "v") { const n = p.n || 6, w = 24 / n; for (let i = 0; i < n; i++) f.push(<rect key={i} x={i * w} y="0" width={w} height="28" fill={p.c[i % 2]} />); }
  if (p.t === "v3") { const w = 4; for (let i = 0; i < 6; i++) f.push(<rect key={i} x={i * w} y="0" width={w} height="28" fill={p.c[i % 3]} />); }
  if (p.t === "b") {
    f.push(<rect key="a" x="0" y="0" width="24" height="28" fill={p.c[0]} />);
    f.push(<rect key="b" x="0" y="9" width="24" height="5.5" fill={p.c[1]} />);
    f.push(<rect key="c" x="0" y="14.5" width="24" height="5.5" fill={p.c[2]} />);
  }
  if (p.t === "d") {
    f.push(<rect key="a" x="0" y="0" width="24" height="28" fill={p.c[0]} />);
    f.push(<polygon key="b" points="0,20 17,0 24,0 24,5 6,28 0,28" fill={p.c[1]} />);
  }
  return (
    <svg width={size} height={size * 28 / 24} viewBox="0 0 24 28" style={{ display: "block", flexShrink: 0 }} aria-hidden="true">
      <defs><clipPath id={id}><path d={ESCUDO_D} /></clipPath></defs>
      <g clipPath={`url(#${id})`}>{f}</g>
      <path d={ESCUDO_D} fill="none" stroke="#16181d" strokeOpacity=".55" strokeWidth="1.6" />
    </svg>
  );
}
function Escudo({ code, size = 16 }) {
  const [falhou, setFalhou] = useState(false);
  if (falhou) return <Desenho code={code} size={size} />;
  return <img src={`${PASTA}/${code}.${EXT}`} alt="" onError={() => setFalhou(true)}
    style={{ display: "block", flexShrink: 0, width: size, height: size, objectFit: "contain" }} />;
}

/* ------------------------------------------------------------------ */
const FACT = [1]; for (let i = 1; i < 12; i++) FACT[i] = FACT[i - 1] * i;
const pk = (l, k) => (Math.exp(-l) * Math.pow(l, k)) / FACT[k];
function rp(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
const CICLO = { undefined: "V", V: "E", E: "D", D: undefined };
const RES_COR = { V: "#15803d", E: "#8a8f96", D: "#b3312c" };


/* ------------------------------------------------------------------ */
/*  Imagem para compartilhar                                           */
/* ------------------------------------------------------------------ */
function svgEscudo(code) {
  const p = PADRAO[code] || { t: "s", c: ["#9aa0a6"] };
  let f = "";
  const rect = (x, y, w, h, cor) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cor}"/>`;
  if (p.t === "s") f = rect(0, 0, 24, 28, p.c[0]);
  if (p.t === "h") for (let i = 0; i < 6; i++) f += rect(0, i * 4.7, 24, 4.7, p.c[i % 2]);
  if (p.t === "v") { const n = p.n || 6, w = 24 / n; for (let i = 0; i < n; i++) f += rect(i * w, 0, w, 28, p.c[i % 2]); }
  if (p.t === "v3") for (let i = 0; i < 6; i++) f += rect(i * 4, 0, 4, 28, p.c[i % 3]);
  if (p.t === "b") f = rect(0, 0, 24, 28, p.c[0]) + rect(0, 9, 24, 5.5, p.c[1]) + rect(0, 14.5, 24, 5.5, p.c[2]);
  if (p.t === "d") f = rect(0, 0, 24, 28, p.c[0]) +
    `<polygon points="0,20 17,0 24,0 24,5 6,28 0,28" fill="${p.c[1]}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 28" width="96" height="112">` +
    `<defs><clipPath id="c"><path d="${ESCUDO_D}"/></clipPath></defs>` +
    `<g clip-path="url(#c)">${f}</g>` +
    `<path d="${ESCUDO_D}" fill="none" stroke="#16181d" stroke-opacity=".55" stroke-width="1.6"/></svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}
const carregaImg = (src) => new Promise((ok, falha) => {
  const im = new Image(); im.onload = () => ok(im); im.onerror = falha; im.src = src;
});
async function escudoImg(code, usarPng) {
  if (usarPng) { try { return await carregaImg(`${PASTA}/${code}.${EXT}`); } catch (e) { /* sem arquivo */ } }
  return carregaImg(svgEscudo(code));
}

async function desenharCard({ tabela, oficiais, verPor, usarPng, link }) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const L = 70, GAP = 10, M = 36, W = 1080;
  const CW = (W - 2 * M - L - (FOCO.length - 1) * GAP) / FOCO.length;
  const TOPO = 236, RH = 72;
  const H = TOPO + RODADAS.length * RH + 216;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const fonte = (px, peso = "400") => `${peso} ${px}px Barlow, system-ui, sans-serif`;
  const cx = (t, x, y, f, cor, al = "center") => { c.font = f; c.fillStyle = cor; c.textAlign = al; c.fillText(t, x, y); };
  const caixa = (x, y, w, h, r, cor) => {
    c.fillStyle = cor; c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.fill();
  };

  c.fillStyle = "#eceee8"; c.fillRect(0, 0, W, H);
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, TOPO - 18);

  cx("Quem cai", M, 78, fonte(54, "700"), "#16181d", "left");
  cx("Brasileirão 2026 · minha simulação", M, 116, fonte(26), "#6b7076", "left");

  const colX = (i) => M + L + i * (CW + GAP);
  const ordem = FOCO.map((code) => tabela.find((t) => t.code === code));
  const imgs = {};
  for (const code of Object.keys(PADRAO)) imgs[code] = null;
  for (const code of FOCO) imgs[code] = await escudoImg(code, usarPng);

  ordem.forEach((t, i) => {
    const x = colX(i) + CW / 2;
    if (imgs[t.code]) {
      const im = imgs[t.code], h = 48, w = im.width ? (im.width / im.height) * h : 41;
      c.drawImage(im, x - w / 2, 148, w, h);
    }
    cx(t.code, x, 214, fonte(22, "700"), "#16181d");
  });

  RODADAS.forEach((r, ri) => {
    const y = TOPO + ri * RH;
    cx(`${r}ª`, M + L - 12, y + 46, fonte(22, "600"), "#8a8f96", "right");
    FOCO.forEach((code, i) => {
      const g = grade[r][code], x = colX(i);
      if (!g) { caixa(x, y, CW, RH - 8, 10, "#e3e5df"); cx("—", x + CW / 2, y + 44, fonte(24), "#b9bcb6"); return; }
      const of = oficiais[g.j.id];
      const res = of
        ? ((g.casa ? of.gh : of.ga) > (g.casa ? of.ga : of.gh) ? "V"
          : (g.casa ? of.gh : of.ga) === (g.casa ? of.ga : of.gh) ? "E" : "D")
        : verPor(g.j, code);
      caixa(x, y, CW, RH - 8, 10, of ? "#f3f4f1" : "#ffffff");
      cx(`${g.adv} ${g.casa ? "casa" : "fora"}`, x + CW / 2, y + 24, fonte(16, "600"), "#6b7076");
      const txt = of ? `${g.casa ? of.gh : of.ga}–${g.casa ? of.ga : of.gh}` : (res || "·");
      cx(txt, x + CW / 2, y + 55, fonte(of ? 24 : 28, "700"), res ? RES_COR[res] : "#c9ccc5");
    });
  });

  const yb = TOPO + RODADAS.length * RH + 16;
  ordem.forEach((t, i) => {
    const cai = tabela.indexOf(t) >= FOCO.length - CAEM, x = colX(i);
    caixa(x, yb, CW, 104, 10, cai ? "#f6ddd9" : "#e4eee6");
    if (imgs[t.code]) {
      const im = imgs[t.code], h = 36, w = im.width ? (im.width / im.height) * h : 31;
      c.drawImage(im, x + CW / 2 - w / 2, yb + 8, w, h);
    }
    cx(String(t.fim), x + CW / 2, yb + 84, fonte(34, "700"), cai ? "#8f2820" : "#16181d");
  });
  cx(`Caem: ${tabela[tabela.length - 2].nome} e ${tabela[tabela.length - 1].nome}`, M, yb + 146, fonte(26, "700"), "#16181d", "left");
  cx(link, M, yb + 182, fonte(20), "#8a8f96", "left");
  return cv;
}

async function gerarImagem(args) {
  for (const usarPng of [true, false]) {
    const cv = await desenharCard({ ...args, usarPng });
    try {
      const url = cv.toDataURL("image/png");
      const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
      if (blob) return { url, blob };
    } catch (e) { /* escudos de outra origem sujaram o canvas: refaz sem eles */ }
  }
  throw new Error("nao foi possivel gerar a imagem");
}

function App() {
  const [fonte, setFonte] = useState(() => window.RESULTADOS || "");
  const [picks, setPicks] = useState({});
  const [mc, setMc] = useState(null);
  const [rodando, setRodando] = useState(false);
  const parar = useRef(false);

  /* planilha externa, se configurada em resultados.js */
  useEffect(() => {
    const url = window.PLANILHA_CSV;
    if (!url) return;
    fetch(url).then((r) => r.text()).then((t) => setFonte(t)).catch(() => {});
  }, []);

  const { jogos: oficiais, erros } = useMemo(() => lerResultados(fonte), [fonte]);
  const { T, ATT, DEF, HM, AM, avisos } = useMemo(() => construir(oficiais), [oficiais]);

  const lam = (h, a) => [HM * ATT[h] * DEF[a], AM * ATT[a] * DEF[h]];
  const odds = (h, a) => {
    const [lh, la] = lam(h, a);
    let w = 0, d = 0, l = 0;
    for (let i = 0; i < 11; i++) for (let j = 0; j < 11; j++) {
      const p = pk(lh, i) * pk(la, j);
      if (i > j) w += p; else if (i === j) d += p; else l += p;
    }
    const s = w + d + l; return [w / s, d / s, l / s];
  };

  const pendentes = useMemo(() => JOGOS.filter((j) => !oficiais[j.id]), [oficiais]);

  const set = (jogo, timeCol, val) => {
    const doMandante = jogo.h === timeCol ? val : val === "V" ? "D" : val === "D" ? "V" : val;
    setMc(null);
    setPicks((p) => { const n = { ...p }; if (!doMandante) delete n[jogo.id]; else n[jogo.id] = doMandante; return n; });
  };
  const verPor = (jogo, time) => {
    const r = picks[jogo.id]; if (!r) return undefined;
    return jogo.h === time ? r : r === "V" ? "D" : r === "D" ? "V" : "E";
  };

  const tabela = useMemo(() => {
    const out = FOCO.map((c) => ({ ...T[c], add: 0, addV: 0, feitos: 0, total: 0 }));
    const by = {}; out.forEach((o) => (by[o.code] = o));
    pendentes.forEach((j) => {
      [j.h, j.a].filter((t) => FOCO.includes(t)).forEach((t) => {
        const o = by[t]; o.total++;
        const r = verPor(j, t); if (!r) return;
        o.feitos++;
        if (r === "V") { o.add += 3; o.addV++; } else if (r === "E") o.add += 1;
      });
    });
    out.forEach((o) => { o.fim = o.pts + o.add; o.vFim = o.v + o.addV; });
    out.sort((x, y) => y.fim - x.fim || y.vFim - x.vFim || y.sg - x.sg);
    return out;
  }, [picks, T, pendentes]);

  const faltam = pendentes.filter((j) => !picks[j.id]).length;

  const sortear = () => {
    const n = { ...picks };
    pendentes.forEach((j) => {
      if (n[j.id]) return;
      const [w, d] = odds(j.h, j.a); const x = Math.random();
      n[j.id] = x < w ? "V" : x < w + d ? "E" : "D";
    });
    setPicks(n); setMc(null);
  };

  const simular = () => {
    if (rodando) return;
    setRodando(true); parar.current = false;
    const NS = 10000, queda = {}, soma = {};
    FOCO.forEach((c) => { queda[c] = 0; soma[c] = 0; });
    let feito = 0;
    const passo = () => {
      if (parar.current) { setRodando(false); return; }
      for (let s = 0; s < 500 && feito < NS; s++, feito++) {
        const st = {};
        FOCO.forEach((c) => (st[c] = { pts: T[c].pts, v: T[c].v, gp: T[c].gp, gc: T[c].gc }));
        pendentes.forEach((j) => {
          const [lh, la] = lam(j.h, j.a);
          let x, y, fix = picks[j.id], n = 0;
          do {
            x = rp(lh); y = rp(la); n++;
            if (!fix) break;
            const r = x > y ? "V" : x === y ? "E" : "D";
            if (r === fix) break;
          } while (n < 60);
          if (fix && n >= 60) { x = fix === "V" ? 1 : 0; y = fix === "D" ? 1 : 0; }
          if (st[j.h]) { const o = st[j.h]; o.gp += x; o.gc += y; if (x > y) { o.pts += 3; o.v++; } else if (x === y) o.pts++; }
          if (st[j.a]) { const o = st[j.a]; o.gp += y; o.gc += x; if (y > x) { o.pts += 3; o.v++; } else if (x === y) o.pts++; }
        });
        const ord = FOCO.slice().sort((a, b) => {
          const A = st[a], B = st[b];
          return B.pts - A.pts || B.v - A.v || (B.gp - B.gc) - (A.gp - A.gc) || B.gp - A.gp || Math.random() - 0.5;
        });
        for (let k = FOCO.length - CAEM; k < FOCO.length; k++) queda[ord[k]]++;
        FOCO.forEach((c) => (soma[c] += st[c].pts));
      }
      if (feito < NS) requestAnimationFrame(passo);
      else {
        const r = {}; FOCO.forEach((c) => (r[c] = { queda: queda[c] / NS, pts: soma[c] / NS }));
        setMc(r); setRodando(false);
      }
    };
    requestAnimationFrame(passo);
  };

  const [img, setImg] = useState(null);
  const [gerando, setGerando] = useState(false);
  const link = typeof location !== "undefined" ? location.href.split("?")[0].split("#")[0] : "";

  const compartilhar = async () => {
    setGerando(true);
    try {
      const r = await gerarImagem({ tabela, oficiais, verPor, link });
      setImg(r);
    } catch (e) {
      alert("Não consegui gerar a imagem neste navegador.");
    }
    setGerando(false);
  };

  const texto = tabela.length
    ? `Briga contra o rebaixamento: ${tabela.map((t) => `${t.code} ${t.fim}`).join(" · ")}. ` +
      `Na minha conta caem ${tabela[tabela.length - 2].nome} e ${tabela[tabela.length - 1].nome}. Faça a sua:`
    : "";

  const enviar = async () => {
    if (!img) return;
    const arq = new File([img.blob], "quem-cai.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      try { await navigator.share({ files: [arq], text: `${texto} ${link}` }); return; } catch (e) { return; }
    }
    baixar();
    window.open(`https://wa.me/?text=${encodeURIComponent(`${texto} ${link}`)}`, "_blank");
  };
  const baixar = () => {
    if (!img) return;
    const a = document.createElement("a");
    a.href = img.url; a.download = "quem-cai.png"; a.click();
  };

  const vizinhos = useMemo(() =>
    Object.values(T)
      .filter((t) => !FOCO.includes(t.code) && !FORA.includes(t.code))
      .sort((a, b) => a.pts - b.pts || a.sg - b.sg)
      .slice(0, 3), [T]);

  const problemas = [...erros, ...avisos];

  return (
    <div style={S.shell}>
      <style>{`
        *{box-sizing:border-box}
        button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
        button:focus-visible{outline:2px solid #e8a33d;outline-offset:-2px}
        .num{font-variant-numeric:tabular-nums}
      `}</style>

      <header style={S.head}>
        <h1 style={S.h1}>Quem cai</h1>
        <p style={S.sub}>
          Dois destes seis descem junto com Chapecoense e Remo. Toque na célula para alternar
          vitória, empate e derrota. Jogos já disputados aparecem com o placar e não mudam.
        </p>
        <div style={S.cols}>
          <span style={S.rlabel} />
          {FOCO.map((c) => (
            <div key={c} style={S.colHead}>
              <Escudo code={c} size={22} />
              <span style={S.colName}>{c}</span>
              <span style={S.colPts} className="num">{T[c].pts}</span>
            </div>
          ))}
        </div>
      </header>

      <main style={S.main}>
        {problemas.length > 0 && (
          <div style={S.erro}>
            <b>resultados.js precisa de atenção</b>
            {problemas.map((e, i) => <div key={i}>{e}</div>)}
          </div>
        )}

        {RODADAS.map((r) => (
          <div key={r} style={S.linha}>
            <span style={S.rlabel} className="num">{r}ª</span>
            {FOCO.map((c) => {
              const g = grade[r][c];
              if (!g) return <div key={c} style={S.vazio}>—</div>;
              const of = oficiais[g.j.id];
              if (of) {
                const meu = g.casa ? of.gh : of.ga, dele = g.casa ? of.ga : of.gh;
                const sinal = meu > dele ? "V" : meu === dele ? "E" : "D";
                return (
                  <div key={c} style={{ ...S.cel, ...S.celFixa }} title={`${NOMES[g.adv]} — resultado oficial`}>
                    <span style={S.advLinha}><Escudo code={g.adv} size={13} /><span style={S.adv}>{g.adv}</span></span>
                    <span style={S.local}>{g.casa ? "🏠" : "✈️"}</span>
                    <span style={{ ...S.placar, color: RES_COR[sinal] }} className="num">{meu}–{dele}</span>
                  </div>
                );
              }
              const res = verPor(g.j, c);
              return (
                <button key={c} style={{ ...S.cel, borderColor: res ? RES_COR[res] : "#dcdeD8" }}
                  onClick={() => set(g.j, c, CICLO[res])}
                  title={`${g.casa ? "em casa contra" : "fora contra"} ${NOMES[g.adv]}`}>
                  <span style={S.advLinha}><Escudo code={g.adv} size={13} /><span style={S.adv}>{g.adv}</span></span>
                  <span style={S.local}>{g.casa ? "🏠" : "✈️"}{g.j.duelo ? " ·" : ""}</span>
                  <span style={{ ...S.res, color: res ? RES_COR[res] : "#c2c5bf" }}>{res || "·"}</span>
                </button>
              );
            })}
          </div>
        ))}

        <button style={S.share} onClick={compartilhar} disabled={gerando}>
          {gerando ? "Montando a imagem…" : "Compartilhar resultado"}
        </button>

        <div style={S.acoes}>
          <button style={S.act} onClick={sortear} disabled={!faltam}>
            {faltam ? `Sortear os ${faltam} que faltam` : "Tudo preenchido"}
          </button>
          <button style={S.act} onClick={() => { setPicks({}); setMc(null); }}>Limpar palpites</button>
        </div>

        <div style={S.blocoMc}>
          <button style={S.mcBtn} onClick={simular} disabled={rodando}>
            {rodando ? "Simulando…" : "Rodar 10 mil cenários"}
          </button>
          {mc && (
            <div style={S.mcGrid}>
              {FOCO.map((c) => (
                <div key={c} style={S.mcItem}>
                  <Escudo code={c} size={18} />
                  <span style={S.mcPts} className="num">{mc[c].pts.toFixed(1)} pts</span>
                  <span style={{ ...S.mcQ, color: mc[c].queda > 0.5 ? "#b3312c" : "#3d4148" }} className="num">
                    {(mc[c].queda * 100).toFixed(0)}% cai
                  </span>
                </div>
              ))}
            </div>
          )}
          <p style={S.mcNota}>A simulação preenche só os jogos em branco e mantém os seus palpites.</p>
        </div>

        <p style={S.aviso}>
          Quem vem logo acima: {vizinhos.map((t) => `${t.nome} ${t.pts}`).join(", ")}.
          Se algum deles despencar, a conta de seis times deixa de valer.
        </p>
      </main>

      {img && (
        <div style={S.modal} onClick={() => setImg(null)}>
          <div style={S.modalBox} onClick={(e) => e.stopPropagation()}>
            <img src={img.url} alt="Resumo da simulação" style={S.preview} />
            <div style={S.modalBtns}>
              <button style={S.mBtnA} onClick={enviar}>Enviar</button>
              <button style={S.mBtnB} onClick={baixar}>Baixar</button>
              <button style={S.mBtnB} onClick={() => setImg(null)}>Fechar</button>
            </div>
          </div>
        </div>
      )}

      <footer style={S.foot}>
        {tabela.map((t, i) => {
          const cai = i >= FOCO.length - CAEM;
          const emp = (i > 0 && tabela[i - 1].fim === t.fim && tabela[i - 1].vFim === t.vFim) ||
            (i < tabela.length - 1 && tabela[i + 1].fim === t.fim && tabela[i + 1].vFim === t.vFim);
          return (
            <div key={t.code} style={{ ...S.fItem, background: cai ? "#fbecea" : "#eef3ee" }}>
              <Escudo code={t.code} size={18} />
              <span style={S.fPts} className="num">{t.fim}</span>
              <span style={S.fSub} className="num">{t.feitos}/{t.total}{emp ? " · saldo" : ""}</span>
            </div>
          );
        })}
      </footer>
    </div>
  );
}

const S = {
  shell: { minHeight: "100vh", background: "#eceee8", color: "#16181d", display: "flex", flexDirection: "column", fontFamily: "'Barlow',system-ui,-apple-system,sans-serif", fontSize: 15 },
  head: { position: "sticky", top: 0, zIndex: 5, background: "#fff", borderBottom: "1px solid #d5d7d1", padding: "14px 8px 0" },
  h1: { margin: 0, fontSize: 25, fontWeight: 700, letterSpacing: "-.3px" },
  sub: { margin: "6px 0 12px", fontSize: 13, lineHeight: 1.4, color: "#6b7076", maxWidth: "48ch" },
  cols: { display: "grid", gridTemplateColumns: "24px repeat(6,1fr)", gap: 3 },
  colHead: { display: "flex", flexDirection: "column", alignItems: "center", gap: 2, paddingBottom: 6 },
    colName: { fontSize: 11, fontWeight: 700, letterSpacing: ".3px" },
  colPts: { fontSize: 11, color: "#6b7076" },

  main: { flex: 1, padding: "8px 8px 146px", maxWidth: 560, width: "100%", margin: "0 auto" },
  erro: { background: "#fff6e5", border: "1px solid #e8c07d", borderRadius: 8, padding: "9px 11px", fontSize: 12.5, lineHeight: 1.5, marginBottom: 10 },
  linha: { display: "grid", gridTemplateColumns: "24px repeat(6,1fr)", gap: 3, marginBottom: 5, alignItems: "stretch" },
  rlabel: { fontSize: 11, fontWeight: 600, color: "#6b7076", display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 2 },
  vazio: { background: "#e3e5df", borderRadius: 6, display: "grid", placeItems: "center", color: "#b9bcb6", fontSize: 13 },
  cel: { background: "#fff", border: "2px solid #dcdeD8", borderRadius: 6, padding: "4px 1px 3px", display: "flex", flexDirection: "column", alignItems: "center", lineHeight: 1.1 },
  celFixa: { background: "#f3f4f1", borderStyle: "dashed", borderColor: "#c9ccc5", cursor: "default" },
  advLinha: { display: "flex", alignItems: "center", gap: 2 },
  adv: { fontSize: 9.5, fontWeight: 700, letterSpacing: ".2px" },
  local: { fontSize: 9, marginTop: 1 },
  res: { fontSize: 16, fontWeight: 700, marginTop: 1 },
  placar: { fontSize: 13, fontWeight: 700, marginTop: 2 },

  share: { width: "100%", marginTop: 14, background: "#16181d", color: "#fff", borderRadius: 8, padding: "13px", fontSize: 16, fontWeight: 600 },
  acoes: { display: "flex", gap: 8, marginTop: 8 },
  modal: { position: "fixed", inset: 0, zIndex: 40, background: "rgba(22,24,29,.72)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 },
  modalBox: { background: "#fff", borderRadius: 12, padding: 12, maxWidth: 420, width: "100%", maxHeight: "92vh", display: "flex", flexDirection: "column", gap: 10 },
  preview: { width: "100%", flex: 1, minHeight: 0, objectFit: "contain", borderRadius: 8, border: "1px solid #d5d7d1" },
  modalBtns: { display: "flex", gap: 8 },
  mBtnA: { flex: 2, background: "#16181d", color: "#fff", borderRadius: 8, padding: "12px", fontSize: 15, fontWeight: 600 },
  mBtnB: { flex: 1, background: "#eceee8", borderRadius: 8, padding: "12px", fontSize: 15, fontWeight: 600 },
  act: { flex: 1, background: "#fff", border: "1px solid #d5d7d1", borderRadius: 8, padding: "10px", fontSize: 14, fontWeight: 600 },

  blocoMc: { marginTop: 14, background: "#fff", border: "1px solid #d5d7d1", borderRadius: 10, padding: 12 },
  mcBtn: { width: "100%", background: "#fff", border: "1px solid #16181d", color: "#16181d", borderRadius: 8, padding: "11px", fontSize: 15, fontWeight: 600 },
  mcGrid: { display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 4, marginTop: 10 },
  mcItem: { display: "flex", flexDirection: "column", alignItems: "center", gap: 2 },
  mcPts: { fontSize: 10.5, color: "#6b7076" },
  mcQ: { fontSize: 12.5, fontWeight: 700 },
  mcNota: { margin: "9px 0 0", fontSize: 11.5, color: "#8a8f96", lineHeight: 1.4 },
  aviso: { marginTop: 14, fontSize: 12, lineHeight: 1.5, color: "#8a8f96", maxWidth: "52ch" },

  foot: { position: "fixed", left: 0, right: 0, bottom: 0, background: "#fff", borderTop: "1px solid #d5d7d1", padding: "8px 8px calc(9px + env(safe-area-inset-bottom))", display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 4, maxWidth: 560, margin: "0 auto" },
  fItem: { borderRadius: 7, padding: "6px 2px", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 },
  fPts: { fontSize: 17, fontWeight: 700, lineHeight: 1 },
  fSub: { fontSize: 9, color: "#8a8f96" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
